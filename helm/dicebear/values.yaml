# This file is a Helm values file for the dicebear chart.
#
# To learn more about how to configure your app on your cluster
# and override the default values in here, visit:
#
#   https://docs.giantswarm.io/tutorials/fleet-management/app-platform/app-configuration/#basic-values-merging-example
#
image:
  # -- Repository of the DiceBear API image, relative to the registry domain.
  name: "giantswarm/dicebear-api"
  # -- Image tag. Pinned explicitly to the mirrored upstream tag; do NOT leave
  # empty to fall back to appVersion, because app-build-suite rewrites
  # appVersion to the chart's dev/release version at build time.
  tag: "4.9"
registry:
  # -- Registry domain the image is pulled from.
  domain: gsoci.azurecr.io

# @schema type:integer;minimum:1
# -- Number of DiceBear API replicas to run.
replicas: 2

# DiceBear HTTP API configuration.
# See https://www.dicebear.com/guides/host-the-http-api-yourself/
config:
  # @schema type:integer;minimum:1;maximum:65535
  # -- Port the DiceBear API listens on.
  port: 3000
  # @schema type:integer;minimum:1
  # -- Largest PNG size (px) the API will render. The avatar edge requests up
  # to 512, and the upstream default of 256 is too small, so we raise the cap.
  pngSizeMax: 512

# @schema type:string
# -- Size limit for the emptyDir volumes backing `/tmp` (PNG rendering) and
# `/run`, to bound node ephemeral-storage use.
emptyDirSizeLimit: 64Mi

# @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.ResourceRequirements
# -- Compute resources for the DiceBear API container.
resources:
  requests:
    cpu: 50m
    # Sized above the observed ~100Mi steady-state working set so the pod is
    # represented honestly to the scheduler, while leaving 2x burst room to the limit.
    memory: 128Mi
    # Required by Kyverno policy for pods using emptyDir. Sized for scheduling;
    # the limit below is what bounds the two emptyDir volumes.
    ephemeral-storage: 64Mi
  limits:
    cpu: 500m
    # ~1.8x the observed ~140Mi peak working set (the metric the OOM killer
    # enforces on), leaving headroom for PNG-render spikes.
    memory: 256Mi
    ephemeral-storage: 256Mi

# @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.PodSecurityContext
# -- Pod-level security context.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# @schema $ref: $k8s/_definitions.json#/definitions/io.k8s.api.core.v1.SecurityContext
# -- Container-level security context.
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop:
      - ALL

# Gateway API routing for the public avatar endpoint. Disabled by default; the
# platform enables it and supplies parentRefs + hostnames. Requires Envoy
# Gateway on the target cluster (the HTTPRouteFilter CRD does the path->query
# rewrite that vanilla Gateway API URLRewrite cannot).
route:
  # @schema type:boolean
  # -- Enable the HTTPRoute and Envoy Gateway HTTPRouteFilter resources.
  enabled: false
  # @schema type:array
  # -- Parent Gateway references the HTTPRoute attaches to. Required when enabled.
  parentRefs: []
  # @schema type:array
  # -- Hostnames the avatar endpoint is served on (e.g. `avatars.example.com`).
  hostnames: []
  # @schema type:string;pattern:^[a-zA-Z0-9]+$
  # -- Path version segment. A future global restyle bumps this to mint fresh URLs.
  version: v1
  # -- Allowed avatar sizes (px). Only these are accepted in the URL.
  sizes: [48, 96, 128, 512]
  # @schema type:integer;minimum:1
  # -- Size used when the URL omits one. Must be one of `sizes`.
  defaultSize: 512
  # @schema type:boolean
  # -- Also expose no-cache preview routes under `/<version>/preview/...` for
  # the creation-time live preview.
  preview: true
  # @schema type:object;additionalProperties:{type:string}
  # -- Extra annotations for the HTTPRoute.
  annotations: {}
  # @schema type:object;additionalProperties:{type:string}
  # -- Extra labels for the HTTPRoute.
  labels: {}
