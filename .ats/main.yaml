app-tests-deploy-namespace: dicebear

# Skip functional and upgrade: this is a brand-new chart with no released
# version to upgrade from, and the smoke test already covers a live deploy
# plus an avatar-render check.
#
# The public routing (route.enabled, the HTTPRoute + Envoy Gateway
# HTTPRouteFilter path->query rewrite) is intentionally NOT exercised here: the
# kind cluster app-test-suite spins up has no Envoy Gateway / Gateway API, so
# the route stays at its default `enabled: false` and the smoke test hits the
# Service directly. The rewrite was verified out-of-band against a live Envoy
# Gateway v1.8.2 (e.g. `/v1/96/<seed>.png` returns a 200 PNG rendered at 96x96,
# a non-allowlisted size 404s, and the preview route carries Cache-Control:
# no-store). Same approach as giantswarm/agentgateway.
skip-steps: [functional,upgrade]
