apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "labels.common" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "labels.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "labels.common" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "name" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    {{- include "labels.selector" . | nindent 20 }}
                topologyKey: kubernetes.io/hostname
      containers:
        - name: {{ include "name" . }}
          image: "{{ .Values.registry.domain }}/{{ .Values.image.name }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: IfNotPresent
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.config.port | quote }}
            - name: HOST
              value: "0.0.0.0"
            - name: PNG_SIZE_MAX
              value: {{ .Values.config.pngSizeMax | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.config.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              # No dedicated health endpoint; the initials SVG route always
              # renders (200) and exercises the render path, so a hung process
              # is caught where a bare TCP check would pass.
              path: /10.x/initials/svg
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /10.x/initials/svg
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            # The DiceBear API needs writable /tmp and /run; the root filesystem
            # is read-only, so back them with emptyDir volumes.
            - name: tmp
              mountPath: /tmp
            - name: run
              mountPath: /run
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ .Values.emptyDirSizeLimit }}
        - name: run
          emptyDir:
            sizeLimit: {{ .Values.emptyDirSizeLimit }}
